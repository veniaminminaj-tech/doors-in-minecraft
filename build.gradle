buildscript {
    repositories { maven { url='https://maven.minecraftforge.net' }; mavenCentral() }
    dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:5.1.+' }
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'

version='1.0.0'
group='com.example.holychurch'
archivesBaseName='holy-church'

java.toolchain.languageVersion = JavaLanguageVersion.of(8)

minecraft {
    mappings channel: 'official', version: '1.16.5'
    runs {
        client { workingDirectory project.file('run'); mods { holychurch { source sourceSets.main } } }
        server { workingDirectory project.file('run'); mods { holychurch { source sourceSets.main } } }
    }
}

dependencies { minecraft 'net.minecraftforge:forge:1.16.5-36.2.34' }

jar { manifest { attributes(['Specification-Title':'Holy Church','Specification-Vendor':'Custom','Specification-Version':version,'Implementation-Title':project.name,'Implementation-Version':version]) } }
